html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #1b1209;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-fond, #status-image {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b1209;
	visibility: hidden;
}

/* La bannière est en paysage : sur un téléphone en portrait, une copie agrandie et floutée remplit l'écran,
   la bannière nette est posée par-dessus, en entier. */
#status-fond {
	background: var(--fond) center / cover no-repeat;
	filter: blur(18px) brightness(0.55);
	transform: scale(1.1);
}

#status-image {
	background: var(--fond) center / contain no-repeat;
}

#status-progress {
	position: absolute;
	left: 50%;
	bottom: 8%;
	transform: translateX(-50%);
	width: min(80%, 360px);
	box-sizing: border-box;
	padding: 10px 14px;
	display: none;
	align-items: center;
	gap: 10px;
	background: rgba(24, 20, 14, 0.82);
	border: 1px solid rgba(255, 255, 255, 0.25);
	border-radius: 8px;
	font-family: 'Noto Sans', 'Droid Sans', Verdana, Arial, sans-serif;
	font-size: 14px;
	color: #e8e8e8;
}

#status-barre {
	flex: 1;
	height: 12px;
	background: #3a352c;
	border: 1px solid #000;
	border-radius: 3px;
	overflow: hidden;
}

#status-remplissage {
	width: 0;
	height: 100%;
	background: linear-gradient(var(--vert-clair), var(--vert));
	transition: width 0.15s linear;
}

/* Taille du téléchargement inconnue : le remplissage va et vient. */
#status-remplissage.indetermine {
	width: 35%;
	animation: va-et-vient 1.2s ease-in-out infinite alternate;
}

@keyframes va-et-vient {
	from { margin-left: 0; }
	to { margin-left: 65%; }
}

#status-pourcent {
	min-width: 3.2em;
	text-align: right;
}

#status-notice {
	display: none;
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	transform: translateY(-50%);
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

	const statusProgress = document.getElementById('status-progress');

	function setStatusMode(mode) {
